<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>バスツアー資料</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
      background: #eef1f4;
      color: #17202a;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: #eef1f4; }
    body { margin: 0; background: #eef1f4; overflow-x: hidden; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      min-height: 56px;
      padding: max(8px, env(safe-area-inset-top)) 12px 8px;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid #d8dee5;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      backdrop-filter: blur(8px);
    }
    .back-button {
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid #b8c2cc;
      border-radius: 10px;
      background: #fff;
      color: #17202a;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .title {
      min-width: 0;
      margin: 0;
      font-size: 17px;
      line-height: 1.25;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .counter {
      min-width: 54px;
      padding: 7px 8px;
      border-radius: 999px;
      background: #edf2f7;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
    }
    .notice {
      max-width: 760px;
      margin: 12px auto 8px;
      padding: 0 12px;
      color: #46515c;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }
    main {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 0 8px max(20px, env(safe-area-inset-bottom));
    }
    .page-card {
      position: relative;
      width: 100%;
      margin: 0 0 12px;
      overflow: hidden;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 2px 10px rgba(0,0,0,.12);
      content-visibility: auto;
      contain-intrinsic-size: auto 1010px;
    }
    .page-card img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      aspect-ratio: 960 / 1281;
      object-fit: contain;
      background: #fff;
    }
    .loading-error {
      display: none;
      padding: 30px 16px;
      color: #a61b1b;
      font-size: 14px;
      line-height: 1.7;
      text-align: center;
    }
    @media (min-width: 700px) {
      main { padding-left: 16px; padding-right: 16px; }
      .page-card { margin-bottom: 18px; border-radius: 12px; }
    }
  </style>
</head>

  <div class="loading-error" id="loadingError">資料画像を読み込めませんでした。GitHubに material.html と material-v4-page-01.jpg～material-v4-page-28.jpg が同じ場所にあるか確認してください。</div>
  <script>
    (() => {
      const backButton = document.getElementById('backButton');
      const counter = document.getElementById('counter');
      const cards = Array.from(document.querySelectorAll('.page-card'));
      const loadingError = document.getElementById('loadingError');
      let errorCount = 0;

      const params = new URLSearchParams(window.location.search);
      const rawReturnUrl = String(params.get('return_url') || '').trim();
      const returnUrl = /^https:\/\//i.test(rawReturnUrl) ? rawReturnUrl : '';
      let returning = false;

      function returnToTicketPage() {
        if (returning) return;
        returning = true;
        backButton.disabled = true;
        backButton.textContent = '戻っています…';

        if (returnUrl) {
          try {
            const target = new URL(returnUrl);
            // bfcache（戻るキャッシュ）を使わず、整理券ページを新しく読み込みます。
            target.searchParams.set('return_from', 'bus_tour_material');
            target.searchParams.set('_reload', String(Date.now()));
            window.location.replace(target.toString());
            return;
          } catch (err) {
            window.location.replace(returnUrl);
            return;
          }
        }

        // 古い整理券ページから開かれた場合だけの予備動作です。
        if (document.referrer && /^https:\/\//i.test(document.referrer)) {
          window.location.replace(document.referrer);
          return;
        }
        window.location.replace('./');
      }

      backButton.addEventListener('click', returnToTicketPage);

      // スマートフォン本体・ブラウザの戻る操作でも白画面を経由しないようにします。
      if (returnUrl) {
        history.replaceState({ materialViewer: true }, '', window.location.href);
        history.pushState({ materialViewerGuard: true }, '', window.location.href);
        window.addEventListener('popstate', returnToTicketPage);
      }

      document.querySelectorAll('.page-card img').forEach(img => {
        img.addEventListener('error', () => {
          errorCount += 1;
          if (errorCount >= 2) loadingError.style.display = 'block';
        });
      });

      const observer = new IntersectionObserver(entries => {
        const visible = entries
          .filter(entry => entry.isIntersecting)
          .sort((a, b) => b.intersectionRatio - a.intersectionRatio);
        if (!visible.length) return;
        const page = Number(visible[0].target.dataset.page || 1);
        counter.textContent = `${page} / 28`;
        document.title = `バスツアー資料（${page} / 28）`;
      }, { rootMargin: '-20% 0px -55% 0px', threshold: [0, .1, .25, .5, .75] });

      cards.forEach(card => observer.observe(card));
    })();
  </script>
