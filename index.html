<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>バスツアー スタッフ用QRカメラ</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #17202a;
      --muted: #667085;
      --line: #d9dee8;
      --main: #0b5fff;
      --ok: #087443;
      --danger: #d92d20;
      --warn: #b54708;
      --shadow: 0 8px 24px rgba(16, 24, 40, 0.08);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 16px;
    }
    .wrap { width: 100%; max-width: 780px; margin: 0 auto; padding: 0 14px 28px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin: 0; }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin: 14px 0;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin: 10px 0 5px;
      font-weight: 800;
    }
    input {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 16px;
      background: #fff;
    }
    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 13px 14px;
      font-weight: 900;
      font-size: 16px;
      margin-top: 12px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .primary { background: var(--main); color: #fff; }
    .secondary { background: #eef2f6; color: var(--text); }
    .danger { background: var(--danger); color: #fff; }
    .okbtn { background: var(--ok); color: #fff; }
    .notice, .error, .success, .warn {
      padding: 13px 15px;
      border-radius: 14px;
      margin: 10px 0 14px;
      font-size: 16px;
      line-height: 1.65;
      font-weight: 800;
      white-space: pre-line;
    }
    .notice { background: #eef4ff; color: #183b7a; }
    .error { background: #fff1f0; color: var(--danger); }
    .success { background: #ecfdf3; color: var(--ok); }
    .warn { background: #fff7ed; color: var(--warn); }
    .scanner {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      min-height: 360px;
      max-height: 72vh;
      background: #0b1220;
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid #111827;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #0b1220;
    }
    canvas { display: none; }
    .scan-frame {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(70vw, 330px);
      height: min(70vw, 330px);
      transform: translate(-50%, -50%);
      border: 4px solid rgba(255,255,255,0.94);
      border-radius: 24px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.28);
      pointer-events: none;
      z-index: 2;
    }
    .scan-help {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      margin: 8px 0 0;
      text-align: center;
    }
    .scan-label {
      position: absolute;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      width: calc(100% - 28px);
      max-width: 520px;
      transform: translateX(-50%);
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.88);
      color: #fff;
      text-align: center;
      font-size: clamp(13px, 3.6vw, 16px);
      line-height: 1.35;
      font-weight: 900;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: keep-all;
      pointer-events: none;
      z-index: 3;
    }
    .result-card {
      border: 2px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin: 12px 0 0;
      background: #fff;
    }
    .result-card.ok { border-color: var(--ok); background: #f0fdf4; }
    .result-card.already { border-color: var(--warn); background: #fff7ed; }
    .result-card.error { border-color: var(--danger); background: #fff1f0; }
    .result-main { font-size: 21px; font-weight: 950; margin-bottom: 6px; }
    .result-overlay {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      background: rgba(15, 23, 42, 0.86);
    }
    .result-overlay.is-visible { display: flex !important; }
    .result-overlay[hidden]:not(.is-visible) { display: none !important; }
    body.result-overlay-open { overflow: hidden; }
    .result-overlay-card {
      width: min(92vw, 620px);
      border-radius: 28px;
      padding: 28px 22px 24px;
      background: #fff;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0,0,0,0.30);
      border: 6px solid var(--ok);
    }
    .result-overlay-card.ok { border-color: var(--ok); }
    .result-overlay-card.already { border-color: var(--warn); }
    .result-overlay-card.error { border-color: var(--danger); }
    .result-overlay-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 88px;
      height: 88px;
      border-radius: 999px;
      margin-bottom: 14px;
      font-size: 52px;
      font-weight: 950;
      color: #fff;
      background: var(--ok);
    }
    .result-overlay-card.already .result-overlay-icon { background: var(--warn); }
    .result-overlay-card.error .result-overlay-icon { background: var(--danger); }
    .result-overlay-title {
      font-size: clamp(28px, 7.5vw, 48px);
      line-height: 1.16;
      font-weight: 1000;
      letter-spacing: -0.03em;
      margin: 4px 0 12px;
    }
    .result-overlay-details {
      font-size: clamp(15px, 4.2vw, 22px);
      line-height: 1.55;
      font-weight: 850;
      color: var(--muted);
      word-break: break-word;
    }
    .result-overlay-close {
      width: auto;
      min-width: 180px;
      margin-top: 20px;
      padding-left: 22px;
      padding-right: 22px;
      background: #eef2f6;
      color: var(--text);
    }
    .tiny { font-size: 12px; color: var(--muted); word-break: break-all; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 520px) {
      .grid { grid-template-columns: 1fr; }
      .wrap { padding-left: 12px; padding-right: 12px; }
      .scanner { min-height: 330px; }
    }
    .test-camera-banner{display:none;padding:10px 12px;background:#fff3cd;border:2px solid #f59e0b;border-radius:12px;color:#7c2d12;font-weight:900;text-align:center;margin-bottom:12px}.test-mode .test-camera-banner{display:block}.test-mode header{border-color:#f59e0b}
</style>
</head>
<body>
  <div id="testCameraBanner" class="test-camera-banner">スタッフテスト用カメラ<br>本番整理券は処理できません</div>
<header>
  <div class="wrap" style="padding-bottom:0;">
    <h1>バスツアー スタッフ用QRカメラ</h1>
    <p class="sub">このページを開いたまま、来場者QRを連続で読み取って乗車処理します。</p>
  </div>
</header>

<main class="wrap">
  <div id="message" class="notice">読み取り準備中です。スタッフパスワードと乗車処理API URLを確認してください。</div>

  <section class="panel" id="setupPanel">
    <label for="qrAppUrlInput">乗車処理API URL（通常は自動入力）</label>
    <input id="qrAppUrlInput" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="url">
    <label for="adminPinInput">スタッフパスワード</label>
    <input id="adminPinInput" type="password" placeholder="Settingsシートの「スタッフパスワード」" autocomplete="current-password">
    <div class="grid">
      <button class="primary" type="button" onclick="saveSettingsAndStart()">カメラを起動する</button>
      <button class="secondary" type="button" onclick="toggleSetup()">設定欄を閉じる</button>
    </div>
    <p class="tiny">スタッフ画面から開いた場合は、最短経路の整理券ページAPIが自動入力されます。URL内の認証情報は読み込み後すぐ削除します。</p>
  </section>

  <section class="panel">
    <div class="scanner">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="canvas"></canvas>
      <div class="scan-frame"></div>
      <div class="scan-label" id="scanLabel">カメラ停止中</div>
    </div>
    <div class="grid">
      <button class="primary" type="button" onclick="startCamera()">カメラを起動</button>
      <button class="secondary" type="button" onclick="stopCamera()">停止</button>
    </div>
    <div class="scan-help" id="scanHelp">読み取れない場合は、QRコードを枠いっぱいに近づけ、画面の反射を避けてください。</div>
    <div class="grid">
      <button class="secondary" type="button" onclick="toggleSetup()">設定を表示</button>
      <button class="danger" type="button" onclick="clearSavedSettings()">保存設定を削除</button>
    </div>
  </section>

  <section class="panel">
    <div style="font-weight:950; font-size:18px;">読み取り結果</div>
    <div id="result" class="result-card">
      <div class="result-main">まだ読み取っていません</div>
      <div class="tiny">QRを読み取ると、ここに処理結果が表示されます。</div>
    </div>
  </section>
</main>

<div id="scanResultOverlay" class="result-overlay" hidden role="dialog" aria-live="assertive" aria-modal="true" onclick="closeBigResult()">
  <div id="scanResultOverlayCard" class="result-overlay-card ok" onclick="event.stopPropagation()">
    <div id="scanResultOverlayIcon" class="result-overlay-icon">✓</div>
    <div id="scanResultOverlayTitle" class="result-overlay-title">乗車確認完了</div>
    <div id="scanResultOverlayDetails" class="result-overlay-details"></div>
    <button type="button" class="result-overlay-close" onclick="closeBigResult()">閉じる</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
  const STORAGE_QR_APP_URL = 'campusBusExternalCameraQrAppUrl';
  const STORAGE_PROCESS_API_URL = 'campusBusExternalCameraProcessApiUrlV2';
  const STORAGE_ADMIN_PIN = 'campusBusExternalCameraAdminPin'; // 旧版削除専用
  const STORAGE_STAFF_SESSION = 'campusBusExternalCameraStaffSessionV1';

  let stream = null;
  let running = false;
  let processing = false;
  let lastCode = '';
  let lastReadAt = 0;
  let detector = null;
  let scanLoopStartedAt = 0;
  let lastSearchingHintAt = 0;
  let resultOverlayTimer = null;
  let congestionHintTimer = null;
  let warmupPromise = null;
  let scanFrameCounter = 0;
  const SCAN_CANVAS_MAX = 980;
  let TEST_MODE = false;
  let TEST_TOKEN = '';

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  window.addEventListener('DOMContentLoaded', init);
  window.addEventListener('pagehide', stopCamera);

  function init() {
    const params = new URLSearchParams(location.search);
    const directProcessUrl = normalizeExecUrl(params.get('processApiUrl') || params.get('process_api_url') || params.get('mainAppUrl') || params.get('main_app_url') || localStorage.getItem(STORAGE_PROCESS_API_URL) || '');
    const legacyQrUrl = normalizeExecUrl(params.get('qrAppUrl') || params.get('qr_app_url') || localStorage.getItem(STORAGE_QR_APP_URL) || '');
    const qrAppUrl = directProcessUrl || legacyQrUrl;
    const urlCredential = params.get('staffSession') || params.get('pin') || params.get('adminPin') || '';
    const savedSession = getSavedStaffSession();
    const pin = isStaffSessionToken(urlCredential) ? urlCredential : (savedSession || urlCredential || '');
    TEST_TOKEN = String(params.get('testToken') || params.get('test_token') || '').trim();
    TEST_MODE = String(params.get('testMode') || '').trim() === '1' || Boolean(TEST_TOKEN);
    if (TEST_MODE) document.body.classList.add('test-mode');
    document.getElementById('qrAppUrlInput').value = qrAppUrl;
    document.getElementById('adminPinInput').value = pin;
    if (directProcessUrl) localStorage.setItem(STORAGE_PROCESS_API_URL, directProcessUrl);
    if (legacyQrUrl) localStorage.setItem(STORAGE_QR_APP_URL, legacyQrUrl);
    if (qrAppUrl && !directProcessUrl && !legacyQrUrl) localStorage.setItem(STORAGE_PROCESS_API_URL, qrAppUrl);
    if (isStaffSessionToken(pin)) saveStaffSession(pin);
    try { localStorage.removeItem(STORAGE_ADMIN_PIN); } catch (err) {}

    // URL履歴にスタッフパスワードを残さない。
    if (params.has('staffSession') || params.has('pin') || params.has('adminPin')) {
      params.delete('staffSession');
      params.delete('pin');
      params.delete('adminPin');
      const clean = location.pathname + (params.toString() ? '?' + params.toString() : '') + location.hash;
      history.replaceState(null, '', clean);
    }

    if (!window.isSecureContext) {
      setMessage('このページがHTTPSで開かれていないため、カメラを起動できません。GitHub Pages / Firebase Hosting / Cloudflare PagesなどのHTTPS URLで開いてください。', 'error');
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setMessage('このブラウザではリアルタイムカメラを使用できません。ChromeまたはSafariで開いてください。', 'error');
      return;
    }
    if ('BarcodeDetector' in window) {
      try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (err) { detector = null; }
    }
    setMessage(TEST_MODE ? 'テスト用カメラです。「カメラを起動」を押してください。' : '準備できました。「カメラを起動」を押してください。', 'notice');
  }

  function normalizeExecUrl(url) {
    let text = String(url || '').trim();
    if (!text) return '';
    text = text.replace(/\/dev(?:\?.*)?$/, '/exec');
    return text;
  }

  function isStaffSessionToken(value) {
    return String(value || '').startsWith('STF1.');
  }

  function decodeStaffSessionExpiry(token) {
    try {
      const parts = String(token || '').split('.');
      if (parts.length !== 3 || parts[0] !== 'STF1') return 0;
      let payloadPart = parts[1].replace(/-/g, '+').replace(/_/g, '/');
      while (payloadPart.length % 4) payloadPart += '=';
      const json = decodeURIComponent(Array.from(atob(payloadPart)).map(ch => '%' + ch.charCodeAt(0).toString(16).padStart(2, '0')).join(''));
      return Number(JSON.parse(json).exp || 0);
    } catch (err) { return 0; }
  }

  function getSavedStaffSession() {
    try {
      const token = String(localStorage.getItem(STORAGE_STAFF_SESSION) || '').trim();
      if (!isStaffSessionToken(token) || decodeStaffSessionExpiry(token) <= Date.now()) {
        localStorage.removeItem(STORAGE_STAFF_SESSION);
        return '';
      }
      return token;
    } catch (err) { return ''; }
  }

  function saveStaffSession(token) {
    const value = String(token || '').trim();
    if (!isStaffSessionToken(value) || decodeStaffSessionExpiry(value) <= Date.now()) return false;
    try {
      localStorage.setItem(STORAGE_STAFF_SESSION, value);
      localStorage.removeItem(STORAGE_ADMIN_PIN);
    } catch (err) {}
    document.getElementById('adminPinInput').value = value;
    return true;
  }

  async function ensureStaffSession(qrAppUrl, credential) {
    const value = String(credential || '').trim();
    if (isStaffSessionToken(value) && decodeStaffSessionExpiry(value) > Date.now()) {
      saveStaffSession(value);
      return value;
    }
    const response = await jsonp(qrAppUrl, { api: 'verifyJsonp', pin: value }, 12000);
    if (!response || !response.ok) throw new Error((response && response.error) || 'スタッフ認証に失敗しました。');
    const token = String(response.staffSessionToken || '').trim();
    if (!saveStaffSession(token)) throw new Error('スタッフ認証情報を保存できませんでした。');
    return token;
  }

  function setMessage(text, type) {
    const el = document.getElementById('message');
    el.className = type || 'notice';
    el.textContent = text || '';
  }

  function setScanLabel(text) {
    document.getElementById('scanLabel').textContent = text || '';
  }

  function setResult(ok, title, details, type) {
    const el = document.getElementById('result');
    const cls = type || (ok ? 'ok' : 'error');
    el.className = 'result-card ' + cls;
    el.innerHTML = '<div class="result-main"></div><div class="tiny"></div>';
    el.querySelector('.result-main').textContent = title || '';
    el.querySelector('.tiny').textContent = details || '';
  }

  function showBigResult(type, title, details, holdMs) {
    const overlay = document.getElementById('scanResultOverlay');
    const card = document.getElementById('scanResultOverlayCard');
    const icon = document.getElementById('scanResultOverlayIcon');
    const titleEl = document.getElementById('scanResultOverlayTitle');
    const detailsEl = document.getElementById('scanResultOverlayDetails');
    if (!overlay || !card || !icon || !titleEl || !detailsEl) return;

    // iOS Safari / Android Chromeで hidden 属性の反映が遅れる場合に備え、
    // hidden・class・inline style の3方向から確実に全画面表示する。
    const cls = type === 'already' ? 'already' : (type === 'error' ? 'error' : 'ok');
    card.className = 'result-overlay-card ' + cls;
    icon.textContent = cls === 'ok' ? '✓' : (cls === 'already' ? '!' : '×');
    titleEl.textContent = title || '';
    detailsEl.textContent = details || '';

    document.body.appendChild(overlay);
    overlay.hidden = false;
    overlay.removeAttribute('hidden');
    overlay.classList.add('is-visible');
    overlay.style.display = 'flex';
    document.body.classList.add('result-overlay-open');

    clearTimeout(resultOverlayTimer);
    const ms = Number(holdMs || 0);
    if (ms > 0) resultOverlayTimer = setTimeout(closeBigResult, ms);
  }

  function closeBigResult() {
    clearTimeout(resultOverlayTimer);
    resultOverlayTimer = null;
    const overlay = document.getElementById('scanResultOverlay');
    if (!overlay) return;
    overlay.classList.remove('is-visible');
    overlay.style.display = 'none';
    overlay.hidden = true;
    document.body.classList.remove('result-overlay-open');
  }

  async function saveSettingsAndStart() {
    const qrAppUrl = normalizeExecUrl(document.getElementById('qrAppUrlInput').value);
    const credential = String(document.getElementById('adminPinInput').value || getSavedStaffSession() || '').trim();
    if (!qrAppUrl) return setMessage('乗車処理API URLを入力してください。', 'error');
    if (!credential) return setMessage('スタッフパスワードを入力してください。', 'error');
    try {
      setMessage('スタッフ認証を確認しています...', 'notice');
      await ensureStaffSession(qrAppUrl, credential);
      localStorage.setItem(STORAGE_PROCESS_API_URL, qrAppUrl);
      document.getElementById('qrAppUrlInput').value = qrAppUrl;
      document.getElementById('setupPanel').style.display = 'none';
      await startCamera();
    } catch (err) {
      setMessage(errorText(err), 'error');
    }
  }

  function toggleSetup() {
    const panel = document.getElementById('setupPanel');
    panel.style.display = panel.style.display === 'none' ? '' : 'none';
  }

  function clearSavedSettings() {
    if (!confirm('保存した乗車処理API URLとスタッフパスワードを削除しますか？')) return;
    localStorage.removeItem(STORAGE_QR_APP_URL);
    localStorage.removeItem(STORAGE_PROCESS_API_URL);
    localStorage.removeItem(STORAGE_ADMIN_PIN);
    localStorage.removeItem(STORAGE_STAFF_SESSION);
    document.getElementById('qrAppUrlInput').value = '';
    document.getElementById('adminPinInput').value = '';
    document.getElementById('setupPanel').style.display = '';
    setMessage('保存設定を削除しました。', 'notice');
  }

  async function startCamera() {
    const qrAppUrl = normalizeExecUrl(document.getElementById('qrAppUrlInput').value || localStorage.getItem(STORAGE_PROCESS_API_URL) || localStorage.getItem(STORAGE_QR_APP_URL));
    const rawCredential = String(document.getElementById('adminPinInput').value || getSavedStaffSession() || '').trim();
    if (!qrAppUrl || !rawCredential) {
      document.getElementById('setupPanel').style.display = '';
      return setMessage('カメラ起動前に、乗車処理API URLとスタッフパスワードを入力してください。', 'error');
    }

    try {
      const staffSession = await ensureStaffSession(qrAppUrl, rawCredential);
      localStorage.setItem(STORAGE_PROCESS_API_URL, qrAppUrl);
      document.getElementById('adminPinInput').value = staffSession;
      stopCamera();
      setMessage('カメラを起動しています...', 'notice');
      setScanLabel('カメラ起動中...');
      stream = await openCameraStream();
      video.srcObject = stream;
      await video.play();
      await optimizeCameraTrack();
      running = true;
      scanLoopStartedAt = Date.now();
      setMessage('カメラ起動中です。来場者のQRコードを枠内に入れてください。読み取ると自動で乗車処理します。', 'success');
      setScanLabel('QRコードを枠内に入れてください');
      requestAnimationFrame(scanLoop);
      warmupPromise = warmupBoardingApi(qrAppUrl, staffSession);
    } catch (err) {
      running = false;
      setScanLabel('カメラを起動できません');
      setMessage(cameraErrorText(err), 'error');
    }
  }

  async function openCameraStream() {
    const attempts = [
      { video: { facingMode: { exact: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 }, focusMode: { ideal: 'continuous' } }, audio: false },
      { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 }, focusMode: { ideal: 'continuous' } }, audio: false },
      { video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
      { video: true, audio: false }
    ];
    let lastError = null;
    for (const constraints of attempts) {
      try { return await navigator.mediaDevices.getUserMedia(constraints); }
      catch (err) { lastError = err; }
    }
    throw lastError || new Error('カメラを起動できませんでした。');
  }

  async function optimizeCameraTrack() {
    try {
      const tracks = stream ? stream.getVideoTracks() : [];
      const track = tracks && tracks[0];
      if (!track || !track.applyConstraints) return;
      const capabilities = track.getCapabilities ? track.getCapabilities() : {};
      const advanced = [];
      if (capabilities.focusMode && capabilities.focusMode.indexOf('continuous') >= 0) {
        advanced.push({ focusMode: 'continuous' });
      }
      if (capabilities.exposureMode && capabilities.exposureMode.indexOf('continuous') >= 0) {
        advanced.push({ exposureMode: 'continuous' });
      }
      if (capabilities.whiteBalanceMode && capabilities.whiteBalanceMode.indexOf('continuous') >= 0) {
        advanced.push({ whiteBalanceMode: 'continuous' });
      }
      if (advanced.length) await track.applyConstraints({ advanced: advanced });
    } catch (err) {}
  }

  function stopCamera() {
    running = false;
    processing = false;
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }
    if (video) video.srcObject = null;
    setScanLabel('カメラ停止中');
  }

  async function warmupBoardingApi(baseUrl, staffSession) {
    try {
      return await jsonp(baseUrl, { api: 'warmupJsonp', staffSession: staffSession }, 15000);
    } catch (err) {
      return null;
    }
  }

  async function fetchTrafficStatusForCamera() {
    try {
      const apiUrl = normalizeExecUrl(document.getElementById('qrAppUrlInput').value || localStorage.getItem(STORAGE_PROCESS_API_URL) || localStorage.getItem(STORAGE_QR_APP_URL));
      if (!apiUrl) return null;
      return await jsonp(apiUrl, { api: 'trafficJsonp' }, 5000);
    } catch (err) {
      return null;
    }
  }

  function startCongestionHint() {
    clearTimeout(congestionHintTimer);
    congestionHintTimer = setTimeout(async () => {
      if (!processing) return;
      const response = await fetchTrafficStatusForCamera();
      const traffic = response && (response.traffic || response.result || response);
      if (!processing || !traffic || traffic.highLoad !== true) return;
      setMessage('現在アクセスが集中しているため、乗車処理に時間がかかっています。順番に処理していますので、そのままお待ちください。', 'warn');
      setScanLabel('アクセス集中のため順番に処理しています...');
    }, 2800);
  }

  function stopCongestionHint() {
    clearTimeout(congestionHintTimer);
    congestionHintTimer = null;
  }

  async function scanLoop() {
    if (!running || processing) {
      if (running) requestAnimationFrame(scanLoop);
      return;
    }
    try {
      const code = await readQrFromVideo();
      if (code) {
        const now = Date.now();
        if (code !== lastCode || now - lastReadAt > 4500) {
          lastCode = code;
          lastReadAt = now;
          await handleScannedCode(code);
        }
      }
    } catch (err) {}
    if (running) requestAnimationFrame(scanLoop);
  }

  async function readQrFromVideo() {
    if (!video.videoWidth || !video.videoHeight) return '';

    // Native BarcodeDetector is fast when available, but some browsers miss
    // small/dense QR codes. Use it first, then fall back to crop-based jsQR.
    if (detector) {
      try {
        const codes = await detector.detect(video);
        if (codes && codes.length) return normalizeScannedText(codes[0].rawValue || '');
      } catch (err) {}
    }
    if (!window.jsQR) return '';

    const width = video.videoWidth;
    const height = video.videoHeight;
    scanFrameCounter += 1;
    const candidates = buildScanCandidates(width, height);
    for (let i = 0; i < candidates.length; i++) {
      const allowEnhanced = (scanFrameCounter % 3 === 0) && i === 0;
      const decoded = decodeCandidate(candidates[i], allowEnhanced);
      if (decoded) return normalizeScannedText(decoded);
    }

    showSearchingHint();
    return '';
  }

  function buildScanCandidates(width, height) {
    const minSide = Math.min(width, height);
    const list = [];
    // Prefer the center area that matches the on-screen frame, then try wider
    // crops and finally the full frame.
    [0.70, 0.90].forEach(ratio => {
      const size = Math.round(minSide * ratio);
      list.push({ sx: Math.round((width - size) / 2), sy: Math.round((height - size) / 2), sw: size, sh: size });
    });
    if (scanFrameCounter % 4 === 0) list.push({ sx: 0, sy: 0, sw: width, sh: height });
    return list;
  }

  function decodeCandidate(candidate, allowEnhanced) {
    const scale = Math.min(SCAN_CANVAS_MAX / candidate.sw, SCAN_CANVAS_MAX / candidate.sh, 1);
    const outW = Math.max(1, Math.round(candidate.sw * scale));
    const outH = Math.max(1, Math.round(candidate.sh * scale));
    canvas.width = outW;
    canvas.height = outH;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(video, candidate.sx, candidate.sy, candidate.sw, candidate.sh, 0, 0, outW, outH);

    let imageData;
    try { imageData = ctx.getImageData(0, 0, outW, outH); }
    catch (err) { return ''; }

    const normal = window.jsQR(imageData.data, outW, outH, { inversionAttempts: 'attemptBoth' });
    if (normal && normal.data) return normal.data;

    if (!allowEnhanced) return '';
    const enhanced = enhanceForQr(imageData);
    const retry = window.jsQR(enhanced.data, outW, outH, { inversionAttempts: 'attemptBoth' });
    return retry && retry.data ? retry.data : '';
  }

  function enhanceForQr(imageData) {
    const src = imageData.data;
    const enhanced = new ImageData(new Uint8ClampedArray(src), imageData.width, imageData.height);
    const data = enhanced.data;
    let total = 0;
    const pixels = data.length / 4;
    for (let i = 0; i < data.length; i += 4) {
      total += (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
    }
    const avg = total / Math.max(pixels, 1);
    const threshold = Math.min(190, Math.max(70, avg));
    for (let i = 0; i < data.length; i += 4) {
      const y = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
      const v = y > threshold ? 255 : 0;
      data[i] = v;
      data[i + 1] = v;
      data[i + 2] = v;
      data[i + 3] = 255;
    }
    return enhanced;
  }

  function normalizeScannedText(value) {
    const text = String(value || '').trim();
    if (!text) return '';
    if (text.indexOf('BUS_TICKET:') === 0) return text;
    return text;
  }

  function showSearchingHint() {
    const now = Date.now();
    if (!scanLoopStartedAt || now - scanLoopStartedAt < 3200) return;
    if (now - lastSearchingHintAt < 3200) return;
    lastSearchingHintAt = now;
    setScanLabel('QRコードを枠いっぱいに入れてください');
  }

  async function handleScannedCode(code) {
    processing = true;
    setScanLabel('読み取りました。乗車処理中...');
    setMessage('QRを読み取りました。乗車処理中です...', 'notice');
    startCongestionHint();
    try {
      const response = await boardByJsonp(code);
      if (!response || !response.ok) throw new Error((response && response.error) || '乗車処理に失敗しました。');
      const r = response.result || {};
      const isAlready = r.processResult === 'ALREADY_BOARDED';
      const title = isAlready ? 'この整理券はすでに乗車確認済みです' : (r.processMessage || '乗車済みにしました。');
      const details = [r.departureLabel || r.departureTime || '', r.ticketNo || '', r.route || '', r.statusLabel || r.status || ''].filter(Boolean).join(' / ');
      setResult(true, title, details, isAlready ? 'already' : 'ok');
      const holdMs = isAlready ? 520 : 320;
      showBigResult(isAlready ? 'already' : 'ok', title, details, holdMs);
      setMessage(isAlready ? '乗車確認済みの整理券です。次のQRを読み取れます。' : '処理が完了しました。次のQRを読み取れます。', isAlready ? 'warn' : 'success');
      setScanLabel(isAlready ? '乗車確認済みです。次のQRコードを枠内に入れてください' : '次のQRコードを枠内に入れてください');
      try { navigator.vibrate && navigator.vibrate(isAlready ? [180, 60, 180] : [80, 40, 80]); } catch (err) {}
      await wait(isAlready ? 140 : 70);
    } catch (err) {
      const msg = errorText(err);
      setResult(false, '処理できませんでした', msg, 'error');
      const holdMs = 1500;
      showBigResult('error', '処理できませんでした', msg, holdMs);
      setMessage(msg, 'error');
      setScanLabel('もう一度QRコードを枠内に入れてください');
      await wait(500);
    } finally {
      stopCongestionHint();
      processing = false;
    }
  }

  async function boardByJsonp(rawCode) {
    const qrAppUrl = normalizeExecUrl(document.getElementById('qrAppUrlInput').value || localStorage.getItem(STORAGE_PROCESS_API_URL) || localStorage.getItem(STORAGE_QR_APP_URL));
    const staffSession = String(document.getElementById('adminPinInput').value || getSavedStaffSession() || '').trim();
    let lastError = null;
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        const response = await jsonp(qrAppUrl, {
          api: 'boardJsonp',
          staffSession: staffSession,
          code: rawCode,
          testToken: TEST_TOKEN
        }, 12000);
        const message = String((response && response.error) || '');
        if (response && response.ok) return response;
        if (attempt < 2 && /アクセスが集中|タイムアウト|一時的|Service invoked too many times/i.test(message)) {
          setMessage('現在アクセスが集中しています\n順番にご案内中です。そのままお待ちください。', 'warn');
          await wait(140 + Math.floor(Math.random() * 180));
          continue;
        }
        return response;
      } catch (err) {
        lastError = err;
        const message = errorText(err);
        if (attempt < 2 && /タイムアウト|接続できません|network|通信/i.test(message)) {
          setMessage('通信が混雑しています。自動で再試行しています...', 'warn');
          await wait(140 + Math.floor(Math.random() * 180));
          continue;
        }
        throw err;
      }
    }
    throw lastError || new Error('乗車処理に失敗しました。');
  }

  function jsonp(baseUrl, params, timeoutMs) {
    return new Promise((resolve, reject) => {
      if (!baseUrl) return reject(new Error('乗車処理API URLが未設定です。'));
      const callbackName = '__busQrCb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
      const script = document.createElement('script');
      const timer = setTimeout(() => {
        cleanup();
        reject(new Error('通信がタイムアウトしました。電波状況を確認してください。'));
      }, timeoutMs || 20000);
      function cleanup() {
        clearTimeout(timer);
        try { delete window[callbackName]; } catch (err) { window[callbackName] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
      }
      window[callbackName] = data => {
        cleanup();
        resolve(data);
      };
      const query = new URLSearchParams(Object.assign({}, params, { callback: callbackName }));
      script.onerror = () => {
        cleanup();
        reject(new Error('乗車処理APIへ接続できませんでした。'));
      };
      script.src = baseUrl + (baseUrl.indexOf('?') >= 0 ? '&' : '?') + query.toString();
      document.head.appendChild(script);
    });
  }

  function errorText(err) {
    if (!err) return 'エラーが発生しました。';
    return String(err.message || err.error || err);
  }

  function cameraErrorText(err) {
    const name = String(err && err.name || '');
    if (name === 'NotAllowedError' || name === 'SecurityError') {
      return 'カメラが許可されていません。ブラウザのアドレスバー付近のカメラ許可、または端末設定を確認してください。LINE等のアプリ内ブラウザではなくChrome/Safariで開いてください。';
    }
    if (name === 'NotFoundError' || name === 'OverconstrainedError') {
      return '利用できるカメラが見つかりません。別のブラウザまたは端末でお試しください。';
    }
    if (name === 'NotReadableError') {
      return '他のアプリがカメラを使用している可能性があります。他のカメラアプリを閉じてから再度お試しください。';
    }
    return 'カメラを起動できませんでした。' + errorText(err);
  }

  function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }
</script>
</body>
</html>
